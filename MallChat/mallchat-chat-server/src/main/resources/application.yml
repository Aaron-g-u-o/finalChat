spring:
  profiles:
    active: test
  datasource:
    url: jdbc:p6spy:mysql://${mallchat.mysql.ip}:${mallchat.mysql.port}/${mallchat.mysql.db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${mallchat.mysql.username}
    password: ${mallchat.mysql.password}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  redis:
    host: ${mallchat.redis.host}
    port: ${mallchat.redis.port}
    password: ${mallchat.redis.password}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

wx:
  mp:
    callback: ${mallchat.wx.callback}
    configs:
      - appId: ${mallchat.wx.appId}
        secret: ${mallchat.wx.secret}
        token: ${mallchat.wx.token}
        aesKey: ${mallchat.wx.aesKey}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleteStatus
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

chatai:
  chatgpt:
    use: ${mallchat.chatgpt.use}
    key: ${mallchat.chatgpt.key}
    aiUserId: ${mallchat.chatgpt.uid}
    proxyUrl: ${mallchat.chatgpt.proxyUrl}
  chatglm2:
    use: ${mallchat.chatglm2.use}
    url: ${mallchat.chatglm2.url}
    aiUserId: ${mallchat.chatglm2.uid}
